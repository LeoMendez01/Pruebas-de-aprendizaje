<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1f2937" />
    <title>Calculadora Básica</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/icon-192.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>Calculadora</h1>
      <section class="calculator" aria-label="Calculadora básica">
        <output id="display" class="display" aria-live="polite">0</output>
        <div class="keys" role="group" aria-label="Teclado numérico y operaciones">
          <button data-action="clear" class="key key-fn">C</button>
          <button data-action="delete" class="key key-fn">⌫</button>
          <button data-action="percent" class="key key-fn">%</button>
          <button data-action="operator" data-value="/" class="key key-op">÷</button>

          <button data-action="number" data-value="7" class="key">7</button>
          <button data-action="number" data-value="8" class="key">8</button>
          <button data-action="number" data-value="9" class="key">9</button>
          <button data-action="operator" data-value="*" class="key key-op">×</button>

          <button data-action="number" data-value="4" class="key">4</button>
          <button data-action="number" data-value="5" class="key">5</button>
          <button data-action="number" data-value="6" class="key">6</button>
          <button data-action="operator" data-value="-" class="key key-op">−</button>

          <button data-action="number" data-value="1" class="key">1</button>
          <button data-action="number" data-value="2" class="key">2</button>
          <button data-action="number" data-value="3" class="key">3</button>
          <button data-action="operator" data-value="+" class="key key-op">+</button>

          <button data-action="number" data-value="0" class="key key-wide">0</button>
          <button data-action="decimal" class="key">.</button>
          <button data-action="equals" class="key key-op">=</button>
        </div>
      </section>
      <p class="hint">Tip: también puedes usar el teclado de tu dispositivo.</p>
    </main>
    <script src="app.js" defer></script>
  </body>
</html>
