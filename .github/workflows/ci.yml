name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  validate-index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required files
        run: |
          test -f index.html
          test -f manifest.webmanifest
          test -f sw.js
          test -f assets/icon.svg

      - name: Validate converter contract in index.html
        run: |
          grep -q "function convert(category, value, from_unit, to_unit, rules)" index.html
          grep -q "const CONVERSIONS =" index.html
          grep -q "No hay conversión disponible entre estas unidades en esta categoría" index.html
          grep -q "Instalar app" index.html

      - name: Basic HTML sanity checks
        run: |
          grep -q "<html" index.html
          grep -q "<script>" index.html
          grep -q "</html>" index.html

      - name: Create downloadable app package
        run: |
          mkdir -p dist/unit-converter-app/assets
          cp index.html dist/unit-converter-app/index.html
          cp manifest.webmanifest dist/unit-converter-app/manifest.webmanifest
          cp sw.js dist/unit-converter-app/sw.js
          cp assets/icon.svg dist/unit-converter-app/assets/icon.svg
          cd dist
          zip -r unit-converter-app.zip unit-converter-app

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: unit-converter-app
          path: dist/unit-converter-app.zip
          if-no-files-found: error
          retention-days: 7
